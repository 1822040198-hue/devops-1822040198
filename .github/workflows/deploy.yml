name: CI/CD Pipeline Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # JOB 1: CHECK (Kiểm tra mã nguồn)
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          test -f index.html || (echo "Thiếu file index.html" && exit 1)
          test -f style.css || (echo "Thiếu file style.css" && exit 1)
          test -f script.js || (echo "Thiếu file script.js" && exit 1)
          echo "Đã đủ 3 file!"

      - name: Check title tag in index.html
        run: |
          grep -i "<title>" index.html || (echo "Lỗi: Không tìm thấy thẻ <title>" && exit 1)
          echo "Thẻ <title> hợp lệ!"

  # JOB 2: DEPLOY (Chỉ chạy khi job check thành công)
  deploy:
    needs: check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4